server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Upload size for evidence uploads
    client_max_body_size 10M;

    # Main Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire endpoints — livewire.js and update are Laravel routes, not
    # physical files. Without this block the regex location for *.js below
    # intercepts /livewire/livewire.js, fails to find it under public/,
    # and returns 404 — breaking every Livewire form (login included).
    # ^~ beats regex matching; try_files passes requests through to Laravel.
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* \.(env|json|lock|md|yaml|yml)$ {
        deny all;
    }

    # Static asset caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
