services:
  # PHP-FPM Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nondon-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - nondon-network
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  web:
    image: nginx:1.27-alpine
    container_name: nondon-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nondon-network
    depends_on:
      - app

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: nondon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nondon
      POSTGRES_USER: nondon_app
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - nondon-db-data:/var/lib/postgresql/data
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    networks:
      - nondon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nondon_app -d nondon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Node.js for Vite asset building (one-shot, run via docker compose run)
  node:
    image: node:20-alpine
    container_name: nondon-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    networks:
      - nondon-network
    command: sh -c "npm install && npm run build"

networks:
  nondon-network:
    driver: bridge

volumes:
  nondon-db-data:
    driver: local
